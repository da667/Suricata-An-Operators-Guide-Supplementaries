#
# /etc/sslproxy/sslproxy.conf
#
# SSLproxy configuration for a Linux lab/test environment.
#

#
# TLS interception CA
#
CACert /etc/sslproxy/ca.crt
CAKey /etc/sslproxy/ca.key

#
# Verify the upstream server certificate.
#
VerifyPeer yes

#
# TLS protocol configuration.
#
MinSSLProto tls10
MaxSSLProto tls13

#
# Modern TLS 1.2 cipher configuration.
#
Ciphers HIGH:!aNULL:!eNULL:!MD5:!RC4

#
# TLS 1.3 cipher suites.
#
CipherSuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

#
# HTTP handling.
#
RemoveHTTPAcceptEncoding no
RemoveHTTPReferer no
MaxHTTPHeaderSize 8192

#
# Connection housekeeping.
#
ConnIdleTimeout 120
ExpiredConnCheckPeriod 60

Daemon yes
#Debug mode is only available when Daemon mode is disabled. (set to "no")
#Debug yes
#DebugLevel 3

#
# Run as an unprivileged account after startup.
#
User sslproxy
Group sslproxy

#
# PID file.
#
PidFile /run/sslproxy.pid

#
# Optional ordinary connection logging.
#
ConnectLog /var/log/sslproxy/connect.log

#
# Optional pcap log
# 
PcapLog /var/log/sslproxy/decrypted.pcap
#
# Optional master-key logging.
#
# MasterKeyLog /var/log/sslproxy/masterkeys.log

#
# ------------------------------------------------------------------
# MIRROR CONFIGURATION
# ------------------------------------------------------------------
#
# Interface on which SSLproxy emits mirrored packets.
#
MirrorIf ens20

#
# IPv4 address of the mirror collector. Suricata binds to an interface
# and in AFPACKET mode should NOT be configured with an IP address, so
# the MirrorTarget directive is commented out.
#
# MirrorTarget 192.0.2.50
#
# ------------------------------------------------------------------
# HTTP PROXYSPEC
# ------------------------------------------------------------------
# If you want to log and mirror HTTP requests, this is how you would do
# that. On top of this, you need to set up ip forwarding, and a
# PREROUTING firewall rule to correctly redirect HTTP traffic to the 
# SSLProxy instance. Commented out.
# See the comments for the HTTPS Proxyspec on how to enable ip
# forwarding, and an example iptables PREROUTING rule you can modify to 
# work with this Proxyspec
#ProxySpec {
#    Proto http
#    Addr 10.0.30.5
#    Port 8080
#
#    Divert no
#
#    FilterRule {
#        Action Split
#        Log mirror
#        Log connect
#        Log pcap
#    }
#}
#
# ------------------------------------------------------------------
# HTTPS PROXYSPEC
# ------------------------------------------------------------------
# 
# This configuration, along with the correct iptables PREROUTING rule,
# and with IP forwarding enabled, will direct HTTPS traffic sent to
# 10.0.30.5 to port 8443, where SSLProxy is listening. Split mode is
# designed for a passively deployed Suricata instance. We configure this
# by setting "Divert" to "no" and Also in the Filter rule directive by 
# setting the "Action" to "Split". We are also logging connection data, 
# and generated a decrypted pcap.
#
# This is the iptables rule you'll need to direct traffic to this SSLProxy
# instance:
# iptables -t nat -A PREROUTING -p tcp --dport 443 -j REDIRECT --to-ports 8443
# You'll also need to persist this rule between reboots via iptable-save
# or some other means.
# 
# You'll also need to set sysctl's net.ipv4.ip_forward to "1" to allow this
# host to route traffic correctly. Consider running:
# echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/98-ip_forwarding_enable.conf
# in order to persist this setting between reboots.
ProxySpec {
    Proto https
    Addr 10.0.30.5
    Port 8443

    Divert no

    CACert /etc/sslproxy/ca.crt
    CAKey /etc/sslproxy/ca.key

    VerifyPeer yes

    MinSSLProto tls10
    MaxSSLProto tls13

    Ciphers HIGH:!aNULL:!eNULL:!MD5:!RC4

    CipherSuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

    RemoveHTTPAcceptEncoding no
    RemoveHTTPReferer no
    MaxHTTPHeaderSize 8192

    #
    # Match all connections without changing the Split action,
    # while enabling mirror logging.
    #
    FilterRule {
        Action Split
        Log mirror
        Log connect
        Log pcap
    }
}
